<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Acceso protegido - Manuel Cárdenas Aspajo</title>
<meta name="robots" content="noindex, nofollow"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous"/>
<script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js" type="text/javascript"></script>
<script type="text/javascript">WebFont.load({  google: {    families: ["DM Sans:400,500,700","Manrope:200,300,400,500,600,700,800"]  }});</script>
<link href="/css/mca-913f08.webflow.shared.406f649e9.css" rel="stylesheet" type="text/css" crossorigin="anonymous"/>
<link href="/images/6a6b8797a884ff97c3358ba3_Captura de pantalla 2026-07-30 a las 19.18.57.png" rel="shortcut icon" type="image/x-icon"/>
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:var(--white);}
  .lock-wrapper{width:100%;max-width:22rem;padding:2rem;text-align:center;box-sizing:border-box;}
  .lock-wrapper h1{font-size:1.5rem;margin-bottom:.5rem;color:var(--off-black);}
  .lock-wrapper p{color:var(--off-black);opacity:.7;margin-bottom:2rem;font-size:.9rem;}
  .lock-input{width:100%;box-sizing:border-box;padding:.9rem 1.25rem;border:1px solid #ccc;border-radius:999px;font-size:.95rem;margin-bottom:1rem;text-align:center;font-family:inherit;}
  .lock-error{color:#c0392b;font-size:.85rem;margin-bottom:1rem;display:none;}
  .lock-button{width:100%;justify-content:center;cursor:pointer;border:none;font-family:inherit;}
</style>
</head>
<body>
<div class="lock-wrapper">
  <h1>MCA</h1>
  <p>Ingrese la contraseña para continuar.</p>
  <form id="lock-form">
    <input id="lock-password" class="lock-input" type="password" placeholder="Contraseña" autocomplete="off" autofocus/>
    <div class="lock-error" id="lock-error">Contraseña incorrecta.</div>
    <button type="submit" class="button lock-button">Entrar</button>
  </form>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var redirect = params.get('redirect') || '/';
  if (localStorage.getItem('mca_unlocked') === '1') {
    location.replace(redirect);
    return;
  }
  document.getElementById('lock-form').addEventListener('submit', function(e){
    e.preventDefault();
    var val = document.getElementById('lock-password').value;
    if (val === 'mca2026') {
      localStorage.setItem('mca_unlocked', '1');
      location.replace(redirect);
    } else {
      document.getElementById('lock-error').style.display = 'block';
    }
  });
})();
</script>
</body>
</html>
